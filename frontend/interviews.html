<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interviews</title>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/forms.css">
  <link rel="stylesheet" href="assets/css/tables.css">
</head>
<body>
  <nav class="navbar"><a class="brand" href="admin-dashboard.html">PlacementPro</a><div class="navlinks" id="interviewNav"></div></nav>
  <main class="container">
    <header class="page-header"><div><p class="eyebrow">Scheduling</p><h1>Interviews</h1></div></header>
    <section id="adminInterviewPanel" class="split-layout hidden">
      <form id="interviewForm" class="form-card">
        <input type="hidden" id="interviewId">
        <label>Application<select id="application_id" required></select></label>
        <label>Date and Time<input id="interview_date" type="datetime-local" required></label>
        <label>Mode<select id="mode"><option value="online">Online</option><option value="offline">Offline</option></select></label>
        <label>Venue<input id="venue"></label>
        <label>Interviewer<input id="interviewer"></label>
        <label>Result<select id="result"><option value="scheduled">Scheduled</option><option value="selected">Selected</option><option value="rejected">Rejected</option><option value="on_hold">On Hold</option></select></label>
        <label>Notes<textarea id="notes"></textarea></label>
        <button class="btn primary" type="submit">Save Interview</button>
      </form>
      <div class="table-wrap"><table><thead><tr><th>Student</th><th>Job</th><th>Date</th><th>Result</th><th>Actions</th></tr></thead><tbody id="interviewsTable"></tbody></table></div>
    </section>
    <section id="studentInterviewPanel" class="table-wrap hidden"><table><thead><tr><th>Job</th><th>Company</th><th>Date</th><th>Mode</th><th>Result</th></tr></thead><tbody id="myInterviewsTable"></tbody></table></section>
  </main>
  <div id="loader" class="loader hidden"></div><div id="toast" class="toast"></div>
  <script src="assets/js/ui.js"></script><script src="assets/js/api.js"></script><script src="assets/js/auth.js"></script><script src="assets/js/interviews.js"></script>
</body>
</html>
