<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Placement Management Login</title>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/forms.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-panel">
      <div>
        <p class="eyebrow">College Placement Cell</p>
        <h1>Placement Management System</h1>
        <p class="muted">Track students, companies, jobs, applications, interviews, and final placement status from one dashboard.</p>
      </div>
      <form id="loginForm" class="form-card">
        <label>Email
          <input type="email" id="email" value="admin@college.edu" required>
        </label>
        <label>Password
          <input type="password" id="password" value="password123" required>
        </label>
        <label>Role
          <select id="role" required>
            <option value="admin">Admin</option>
            <option value="student">Student</option>
          </select>
        </label>
        <button class="btn primary" type="submit">Login</button>
        <p class="hint">Sample student: aarav@student.edu / password123</p>
      </form>
    </section>
  </main>
  <div id="toast" class="toast"></div>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/login.js"></script>
</body>
</html>
