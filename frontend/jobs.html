<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jobs</title>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/forms.css">
  <link rel="stylesheet" href="assets/css/tables.css">
</head>
<body>
  <nav class="navbar"><a class="brand" href="admin-dashboard.html">PlacementPro</a><div class="navlinks" id="jobNav"></div></nav>
  <main class="container">
    <header class="page-header"><div><p class="eyebrow">Placements</p><h1>Job Postings</h1></div></header>
    <section id="adminJobPanel" class="split-layout hidden">
      <form id="jobForm" class="form-card">
        <input type="hidden" id="jobId">
        <label>Company<select id="company_id" required></select></label>
        <label>Title<input id="title" required></label>
        <label>Description<textarea id="description" required></textarea></label>
        <label>Package LPA<input id="package_lpa" type="number" step="0.01" required></label>
        <label>Minimum CGPA<input id="min_cgpa" type="number" step="0.01" min="0" max="10" required></label>
        <label>Location<input id="location"></label>
        <label>Deadline<input id="deadline" type="date" required></label>
        <label>Status<select id="status"><option value="open">Open</option><option value="closed">Closed</option></select></label>
        <button class="btn primary" type="submit">Save Job</button>
      </form>
      <div class="table-wrap"><table><thead><tr><th>Title</th><th>Company</th><th>Package</th><th>Status</th><th>Actions</th></tr></thead><tbody id="jobsTable"></tbody></table></div>
    </section>
    <section id="studentJobPanel" class="job-grid"></section>
  </main>
  <div id="loader" class="loader hidden"></div><div id="toast" class="toast"></div>
  <script src="assets/js/ui.js"></script><script src="assets/js/api.js"></script><script src="assets/js/auth.js"></script><script src="assets/js/jobs.js"></script>
</body>
</html>
