<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Students</title>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/forms.css">
  <link rel="stylesheet" href="assets/css/tables.css">
</head>
<body>
  <nav class="navbar"><a class="brand" href="admin-dashboard.html">PlacementPro</a><div class="navlinks"><a href="admin-dashboard.html">Analytics</a><a href="companies.html">Companies</a><a href="jobs.html">Jobs</a><button class="btn ghost" onclick="logout()">Logout</button></div></nav>
  <main class="container">
    <header class="page-header"><div><p class="eyebrow">Admin</p><h1>Student Management</h1></div></header>
    <section class="split-layout">
      <form id="studentForm" class="form-card">
        <input type="hidden" id="studentId">
        <label>Name<input id="name" required></label>
        <label>Email<input id="email" type="email" required></label>
        <label>Password<input id="password" type="password" placeholder="Default: password123"></label>
        <label>Roll No<input id="roll_no" required></label>
        <label>Department<input id="department" required></label>
        <label>Graduation Year<input id="graduation_year" type="number" value="2026" required></label>
        <label>CGPA<input id="cgpa" type="number" step="0.01" min="0" max="10" required></label>
        <label>Skills<input id="skills" placeholder="JavaScript, SQL, Python"></label>
        <label>Phone<input id="phone"></label>
        <label>Resume URL<input id="resume_url"></label>
        <button class="btn primary" type="submit">Save Student</button>
      </form>
      <div class="table-wrap"><table><thead><tr><th>Name</th><th>Roll</th><th>Department</th><th>CGPA</th><th>Skills</th><th>Actions</th></tr></thead><tbody id="studentsTable"></tbody></table></div>
    </section>
  </main>
  <div id="loader" class="loader hidden"></div><div id="toast" class="toast"></div>
  <script src="assets/js/ui.js"></script><script src="assets/js/api.js"></script><script src="assets/js/auth.js"></script><script src="assets/js/students.js"></script>
</body>
</html>
